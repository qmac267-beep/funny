<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chạm Đến Ngàn Sao - Gửi 20/10 Rực Rỡ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030014;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Nền vũ trụ & hạt tương tác */
        #universeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Khung kính mờ Glassmorphism cực sang */
        .peak-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 30%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.sub-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Hộp quà 3D tinh tế */
        .gift-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gift-wrapper:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .gift-box-icon {
            font-size: 5.5rem;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.6));
            animation: floatingBox 3s ease-in-out infinite;
        }

        @keyframes floatingBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .tap-instruction {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 500;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Khung thông điệp kiểu gõ chữ */
        .message-panel {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 18px;
            padding: 20px;
            margin-top: 15px;
            text-align: left;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            animation: fadeInMsg 0.8s ease forwards;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f1f5f9;
            min-height: 90px;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Nút âm thanh */
        .music-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s;
        }

        .music-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Nút phát nhạc -->
    <div class="music-toggle" id="audioToggleBtn" onclick="toggleAudio()" title="Bật/Tắt nhạc nền">
        <i class="fa-solid fa-music"></i>
    </div>

    <!-- Canvas Nền Vũ Trụ & Sao Lấp Lánh -->
    <canvas id="universeCanvas"></canvas>

    <!-- Thẻ giao diện chính -->
    <div class="peak-card">
        <span class="tag">20.10 Thanh Xuân</span>
        <h1>Chào Ngày 20/10</h1>
        <p class="sub-desc">Gửi những lời chúc tuyệt vời nhất đến một nửa thế giới</p>

        <!-- Hộp quà -->
        <div class="gift-wrapper" onclick="openSurprise()">
            <div class="gift-box-icon" id="giftIcon">
                <i class="fa-solid fa-gift"></i>
            </div>
        </div>
        <div class="tap-instruction" id="tapInstruction">✨ Chạm để mở món quà đặc biệt ✨</div>

        <!-- Khung lời chúc -->
        <div class="message-panel" id="messagePanel">
            <div class="message-content" id="typewriterOutput"></div>
        </div>

        <div class="footer-credit">
            MADE WITH VIBE & CODE • LỚP 9 EDITION
        </div>
    </div>

    <!-- Nhạc nền du dương -->
    <audio id="bgMusic" loop src="https://assets.mixkit.co/music/preview/mixkit-a-very-happy-christmas-897.mp3"></audio>

    <script>
        // Nội dung chuẩn vibe học sinh lớp 9: vừa đẹp, vừa chất, không sến
        const customMessage = "Chúc các bạn nữ (và một nửa tuyệt vời của thế giới) luôn giữ được nụ cười rạng rỡ, luôn tự tin, tỏa sáng rực rỡ như những vì sao. Chúc việc học hành luôn thuận lợi, kiểm tra toàn điểm 9 điểm 10, gặt hái thật nhiều thành công và có một ngày 20/10 thật trọn vẹn, đáng nhớ nhé! 🚀✨";

        let isOpened = false;

        function openSurprise() {
            if (isOpened) return;
            isOpened = true;

            document.getElementById('giftIcon').innerHTML = '<i class="fa-solid fa-box-open"></i>';
            document.getElementById('tapInstruction').style.display = 'none';
            document.getElementById('messagePanel').style.display = 'block';

            runTypewriter(customMessage);
            createFireworkBurst();

            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(() => {});
            }
        }

        // Hiệu ứng gõ chữ
        function runTypewriter(text) {
            const target = document.getElementById('typewriterOutput');
            target.innerHTML = '';
            let idx = 0;

            function typing() {
                if (idx < text.length) {
                    target.innerHTML += text.charAt(idx);
                    idx++;
                    setTimeout(typing, 25);
                }
            }
            typing();
        }

        // Điều khiển nhạc
        function toggleAudio() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('audioToggleBtn');
            if (music.paused) {
                music.play();
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            } else {
                music.pause();
                btn.innerHTML = '<i class="fa-solid fa-music"></i>';
            }
        }

        // --- CANVAS NỀN VŨ TRỤ & PHÁO HOA ---
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const stars = [];
        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        const particles = [];
        const symbols = ['✨', '⭐', '🌸', '💖'];

        function createFireworkBurst() {
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    char: symbols[Math.floor(Math.random() * symbols.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015,
                    size: Math.random() * 12 + 10
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ sao lấp lánh nền
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ pháo hoa / hạt khi mở quà
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.font = `${p.size}px sans-serif`;
                ctx.fillText(p.char, p.x, p.y);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
